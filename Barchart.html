<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/vega@6.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.1.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.0.2"></script>
</head>
<body>
  <div id="vis"/>
  <script>
    const spec = {
  "$schema": "https://vega.github.io/schema/vega-lite/v6.json",
  "width": 700,
  "height": 650,
  "title": "Accident Distribution by Day of Week",
  "data": {
    "url": "https://raw.githubusercontent.com/sheriefAbdallah/CS318/refs/heads/main/Traffic_Incidents.csv",
    "format": {
      "type": "csv",
      "parse": {"acci_time": "date:'%d/%m/%Y %H:%M:%S'"}
    }
  },
  "transform": [
    {"calculate": "timeFormat(datum.acci_time, '%A')", "as": "weekday"}
  ],
  "params": [
    {"name": "highlight", "select": {"type": "point", "on": "pointerover"}},
    {"name": "select", "select": "point"}
  ],
  "mark": {"type": "bar", "cursor": "pointer"},
  "encoding": {
    "x": {
      "title": "Day of the Week",
      "field": "weekday",
      "type": "ordinal",
      "axis": {"labelAngle": 0},
      "sort": [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday"
      ]
    },
    "y": {
      "title": "Number of Accidents Reported",
      "aggregate": "count",
      "type": "quantitative"
    },
    "fillOpacity": {"condition": {"param": "select", "value": 1}, "value": 0.3},
    "color": {
      "title": "Day of the Week",
      "field": "weekday",
      "type": "nominal",
      "scale": {"scheme": "tableau10"},
      "sort": [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday"
      ]
    },
    "tooltip": [
      {"field": "weekday", "type": "ordinal", "title": "Day of Week"},
      {
        "aggregate": "count",
        "type": "quantitative",
        "title": "Accidents Reported"
      }
    ]
  },
  "config": {}
};
    vegaEmbed("#vis", spec, {mode: "vega-lite"}).then(console.log).catch(console.warn);
  </script>
</body>
</html>
